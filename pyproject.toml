[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "glassbox"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
glassbox-mcp-server = "glassbox.api.mcp_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glassbox*"]
