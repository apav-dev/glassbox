[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "starlette>=0.40,<0.47",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.11,<3.0",
    "alpaca-py>=0.43,<1.0",
    "yfinance>=1.0,<2.0",
    "mcp>=1.0.0,<2.0.0",
    "sse-starlette>=1.6.1,<3.0",
    "httpx>=0.27.0,<1.0",
    "pytz>=2024,<2027",
]

[project.scripts]
glassbox-mcp-server = "glassbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glassbox*"]
